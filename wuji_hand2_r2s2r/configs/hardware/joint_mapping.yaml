# Canonical joint mapping for Wuji Hand 2 (Beta 1)
# Source: official MJCF hand2/hand2_beta1/body/mjcf/{left,right}.xml
# SDK: finger(i).joint(j) with i in [0..4], j in [0..3]
# Evidence: [Official-doc verified] docs.wuji.tech + wuji-description

hand_revision: hand2_beta1
dof: 20
units: radian
base_frame: "{side}_wrist"  # r_wrist / l_wrist
convention: anatomical_names_frozen_at_beta1

# Canonical order used everywhere: training, real, MuJoCo, Isaac
# Index = finger * 4 + joint_within_finger
canonical_joints:
  - index: 0
    name: thumb_cmc_flex
    finger: 0
    finger_name: thumb
    joint_in_finger: 0
    sdk_finger: 0
    sdk_joint: 0
    mjcf_right: r_thumb_cmc_flex
    mjcf_left: l_thumb_cmc_flex
    actuator_right: r_THJ0
    actuator_left: l_THJ0
    axis: [1, 0, 0]
    limit_lower: -1.187
    limit_upper: 1.291
    effort_limit: 0.6
  - index: 1
